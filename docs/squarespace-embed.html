<!--
  MIP Gear Library — Squarespace embed (auto-resize).

  Paste this into a Code Block on the Squarespace page where you want the
  gear library to appear. The iframe height auto-adjusts based on
  postMessage events from mip-calendar.vercel.app.
-->
<div id="mip-gear-embed" style="width:100%;max-width:1120px;margin:0 auto;">
  <iframe
    id="mip-gear-iframe"
    src="https://mip-calendar.vercel.app/gear"
    title="MIP Gear Library"
    style="width:100%;min-height:900px;border:0;display:block;"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>
<script>
  (function () {
    var TRUSTED_ORIGIN = "https://mip-calendar.vercel.app";
    var iframe = document.getElementById("mip-gear-iframe");
    if (!iframe) return;
    window.addEventListener("message", function (event) {
      if (event.origin !== TRUSTED_ORIGIN) return;
      var data = event.data;
      if (!data || data.type !== "mip-gear:height") return;
      var h = Number(data.height);
      if (!isFinite(h) || h <= 0) return;
      // Small buffer so the last row isn't clipped by rounding.
      iframe.style.height = Math.max(600, Math.ceil(h) + 24) + "px";
    });
  })();
</script>
